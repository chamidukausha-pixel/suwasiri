# This machine has ~8GB RAM. The Flutter template's -Xmx8G/-XX:MaxMetaspaceSize=4G
# OOMs the Gradle daemon (hs_err mmap failure) and can leave incomplete plugin jars.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter template defaults — keep until Firebase plugins migrate to Built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false
